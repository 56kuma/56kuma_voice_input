[package]
name = "voice_input"
version = "0.1.0"
edition = "2021"
description = "Lightweight background voice input: Ctrl+Space, speak, Ctrl+Space, text appears at the cursor."
license = "MIT"
default-run = "voice_input"

[lib]
name = "voice_input"
path = "src/lib.rs"

[[bin]]
name = "voice_input"
path = "src/main.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
hound = "3"
cpal = "0.15"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "async-secret-service", "tokio", "crypto-rust"] }
global-hotkey = "0.6"
arboard = "3"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "test-util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
